<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Invaders</title>
<style>
  :root {
    --green: #33ff33;
    --dim: #1d7a1d;
    --bg: #2b2b2b;
  }
  body {
    background: var(--bg);
    color: #ddd;
    font-family: "Courier New", Courier, monospace;
    margin: 0;
    padding: 12px 16px 32px;
  }
  h1 {
    color: var(--green);
    text-align: center;
    letter-spacing: 0.2em;
    font-size: 22px;
    margin: 0 0 2px;
    text-transform: uppercase;
  }
  p.tagline {
    text-align: center;
    color: #aaa;
    max-width: 720px;
    margin: 0 auto 14px;
    font-size: 12px;
    line-height: 1.4;
  }
  .wrap {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  canvas#game {
    background: #000;
    border: 2px solid var(--green);
    image-rendering: pixelated;
    display: block;
    cursor: crosshair;
  }
  #codepanel {
    width: 470px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    background: #101010;
    border: 1px solid #555;
    padding: 0 12px 8px;
    box-sizing: border-box;
    font-size: 11px;
    line-height: 1.3;
  }
  #codepanel h2 {
    color: #999;
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid #333;
    margin: 0 0 6px;
    padding: 7px 0 3px;
  }
  .group h3 {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #101010;
    color: #b9b96a;
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 0 -12px 4px;
    padding: 4px 12px 3px;
    border-bottom: 1px solid #2a2a2a;
  }
  pre {
    margin: 0;
    white-space: pre;
    overflow-x: auto;
  }
  #consts { padding: 6px 4px 2px; }
  .tunable { margin-bottom: 20px; }
  .tunable pre {
    color: #7ec8e3;
    font-size: 13px;
    margin-bottom: 6px;
    cursor: pointer;
    user-select: none;
  }
  .tunable pre:hover { background: #16323e; }
  .tunable .val { color: #fff; }
  .tunable input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 4px;
    background: #333;
    outline: none;
    margin: 8px 0 3px;
  }
  .tunable input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 16px;
    background: var(--green);
    cursor: pointer;
  }
  .tunable input[type=range]::-moz-range-thumb {
    width: 10px;
    height: 16px;
    background: var(--green);
    border: none;
    border-radius: 0;
    cursor: pointer;
  }
  .tunable .range-labels {
    display: flex;
    justify-content: space-between;
    color: #555;
    font-size: 10px;
  }
  .rule {
    position: relative;
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
    padding: 2px 4px 2px 14px;
    margin-left: -4px;
    margin-right: -4px;
  }
  .rule:hover { background: #1c1c1c; }
  .rule .led {
    position: absolute;
    left: 3px;
    top: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 5px var(--green);
    opacity: 0;
  }
  .rule pre {
    color: var(--green);
    transition: opacity 0.15s;
  }
  .rule.off pre {
    opacity: 0.3;
    text-decoration: line-through;
    text-decoration-color: #f55;
  }
  @keyframes rulepulse {
    0%, 100% { background: #1c1c1c; }
    50%      { background: #2e4d2e; }
  }
  .rule.pulse { animation: rulepulse 0.4s 4; }
  #overlay {
    position: fixed;
    inset: 0;
    background: none;
    border: none;
    pointer-events: none;
    z-index: 10;
  }
  .controls {
    width: 484px;
    box-sizing: border-box;
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }
  .controls button {
    flex: 1;
    background: #111;
    color: var(--green);
    border: 1px solid var(--green);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 0;
    cursor: pointer;
  }
  .controls button:hover { background: #0a2a0a; }
  #modeToggle {
    display: flex;
    width: 470px;
    box-sizing: border-box;
    margin-bottom: 8px;
  }
  #modeToggle button {
    flex: 1;
    background: #111;
    color: #777;
    border: 1px solid #555;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 7px 0;
    cursor: pointer;
  }
  #modeToggle button.active {
    color: var(--green);
    border-color: var(--green);
    background: #0a2a0a;
  }
  .gamecol .keys {
    color: #888;
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
  }
  footer {
    width: 484px;
    box-sizing: border-box;
    text-align: left;
    color: #777;
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.6;
  }
  footer a { color: #9f9; }
</style>
</head>
<body>

<h1>Code Invaders</h1>
<p class="tagline">
  Space Invaders with twelve rules and eight variables.<br>
  <span id="modeHint"></span>
</p>

<canvas id="overlay"></canvas>

<div class="wrap">
  <div class="gamecol">
    <canvas id="game" width="480" height="540"></canvas>
    <div class="keys">&larr; &rarr; move &nbsp;&middot;&nbsp; space fire &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; R restart</div>
    <div class="controls">
      <button id="restoreBtn">restore all code</button>
      <button id="restartBtn">restart game</button>
    </div>
    <footer>
      Inspired by <a href="https://web.archive.org/web/20080420084021/http://www.retrodev.co.uk/MiscGames/NakedGame/TheNakedGame.html">The Naked Game</a>, a Flash-era version of Pong that let you switch off its own code line by line.
    </footer>
  </div>
  <div class="panelcol">
    <div id="modeToggle">
      <button data-mode="rules">rules</button>
      <button data-mode="vars">variables</button>
    </div>
    <div id="codepanel">
      <!-- <h2>the code, running live</h2> -->
      <div class="group" id="physicsGroup">
        <h3>physics</h3>
        <div id="consts"></div>
      </div>
      <div id="rules"></div>
    </div>
  </div>
</div>

<script>
"use strict";

// ---- constants --------------------------------------------------------
const W = 480, H = 540;
const PLAYER_W = 26, PLAYER_H = 14;

// the physics: shown in the panel, changed live by dragging a value
let PLAYER_SPEED = 10;
let BULLET_SPEED = 11;
let GRAVITY      = 3;
let BOMB_CHANCE  = 0.02;
let MARCH_STEP   = 8;
let DESCENT      = 18;
let POINTS       = 10;
let LIVES        = 3;
const ROWS = 4, COLS = 8;
const INV_W = 22, INV_H = 16;
const MARGIN = 8;
const BUNKER_CELL = 4;
const BUNKER_Y = H - 130;

// ---- game state -------------------------------------------------------
// Bullets and bombs both store their leading tip as (x, y):
// a bullet's nose points up, a bomb's tip points down.
let player, bullets, bombs, invaders, bunkers, fleetDir;
let marchTimer;
let score, lives, over, paused, hitFlash;
let canFire, fleetMoved, firePressed;
const keys = {};

function spawnWave() {
  invaders = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      invaders.push({ x: 44 + c * 46, y: 70 + r * 36, alive: true });
  fleetDir = 1;
  marchTimer = 5 + invaders.length;
}

const BUNKER_SHAPE = [
  "..XXXXXXX..",
  ".XXXXXXXXX.",
  "XXXXXXXXXXX",
  "XXXXXXXXXXX",
  "XXXXXXXXXXX",
  "XXXX...XXXX",
  "XXX.....XXX",
  "XXX.....XXX",
];

function spawnBunkers() {
  bunkers = [];
  for (let i = 0; i < 4; i++)
    bunkers.push({
      x: 38 + i * 120,
      y: BUNKER_Y,
      cells: BUNKER_SHAPE.map(row => [...row].map(ch => ch === "X")),
    });
}

function reset() {
  player = { x: W / 2 - PLAYER_W / 2, y: H - 60 };
  bullets = [];
  bombs = [];
  score = 0;
  lives = LIVES;
  over = false;
  paused = false;
  hitFlash = 0;
  firePressed = false;
  spawnWave();
  spawnBunkers();
}

// ---- helpers: the hidden machinery the rules lean on --------------------
// These are always on; the panel shows only the rules below.

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

// the invaders still alive
function fleet() {
  return invaders.filter(inv => inv.alive);
}

// every projectile in flight
function shots() {
  return [...bullets, ...bombs];
}

function fleetAtEdge() {
  return fleet().some(inv => inv.x < MARGIN ||
                             inv.x + INV_W > W - MARGIN);
}

// the alive invader at pixel (x, y), or null
function invaderAt(x, y) {
  return invaders.find(inv => inv.alive &&
           x > inv.x && x < inv.x + INV_W &&
           y > inv.y && y < inv.y + INV_H) || null;
}

// the player's cannon, if it covers pixel (x, y)
function cannonAt(x, y) {
  return x > player.x && x < player.x + PLAYER_W &&
         y > player.y && y < player.y + PLAYER_H ? player : null;
}

// the solid bunker cell at pixel (x, y), or null
function bunkerAt(x, y) {
  for (const bunker of bunkers) {
    const c = Math.floor((x - bunker.x) / BUNKER_CELL);
    const r = Math.floor((y - bunker.y) / BUNKER_CELL);
    if (r >= 0 && c >= 0 && bunker.cells[r] && bunker.cells[r][c])
      return { bunker, r, c };
  }
  return null;
}

function randomInvader() {
  const f = fleet();
  return f[Math.floor(Math.random() * f.length)] || null;
}

// a shot still near the board (with a little slack) stays alive
function onBoard(b) {
  return b.y > -12 && b.y < H + 12;
}

// what an impact does: invaders die for points, the cannon
// loses a life, bunkers crumble
function damage(hit) {
  if (hit.alive) { hit.alive = false; score += POINTS; }
  else if (hit === player) { lives -= 1; hitFlash = 40; }
  else if (hit.bunker) blast(hit);
}

// blast a 3x3 chunk of bunker cells around a hit cell
function blast({ bunker, r, c }) {
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++)
      if (r + dr >= 0 && c + dc >= 0 && bunker.cells[r + dr])
        bunker.cells[r + dr][c + dc] = false;
}

// clear every bunker cell an invader overlaps
function crushBunkers(inv) {
  if (inv.y + INV_H < BUNKER_Y) return;
  for (const bunker of bunkers)
    for (let r = 0; r < bunker.cells.length; r++)
      for (let c = 0; c < bunker.cells[r].length; c++) {
        const cx = bunker.x + c * BUNKER_CELL;
        const cy = bunker.y + r * BUNKER_CELL;
        if (cx < inv.x + INV_W && cx + BUNKER_CELL > inv.x &&
            cy < inv.y + INV_H && cy + BUNKER_CELL > inv.y)
          bunker.cells[r][c] = false;
      }
}

// sweep out shots that collided this frame
function cull() {
  bullets = bullets.filter(b => !b.dead);
  bombs = bombs.filter(b => !b.dead);
}

// cheap fingerprint of everything a rule might change; run() compares
// it before and after each rule to light that rule's activity dot
function stateHash() {
  let h = player.x * 1.7 + score * 3 + lives * 5 + fleetDir * 7
        + (canFire ? 11 : 0) + (over ? 13 : 0);
  for (const s of shots())
    h += s.x + s.y * 1.3 + (s.hit ? 3 : 0) + (s.dead ? 5 : 0);
  for (const inv of invaders)
    if (inv.alive) h += inv.x * 1.1 + inv.y + 9;
  for (const bunker of bunkers)
    for (const row of bunker.cells)
      for (const cell of row) if (cell) h += 0.37;
  return h;
}

// ---- the rules --------------------------------------------------------
// Each function body below is displayed in the side panel *verbatim*
// (via Function.prototype.toString) and only runs while it hasn't been
// clicked off. Keep every line under ~64 characters so the panel
// never scrolls sideways.

function movePlayer() {
  const v = PLAYER_SPEED ** 2 / 25;
  if (keys.ArrowLeft)  player.x -= v;
  if (keys.ArrowRight) player.x += v;
}

function moveShots() {
  for (const b of bullets) b.y -= BULLET_SPEED - GRAVITY;
  for (const b of bombs)   b.y += GRAVITY;
}

function marchFleet() {
  if (--marchTimer > 0) return;
  marchTimer = 5 + fleet().length;
  for (const inv of fleet()) inv.x += MARCH_STEP * fleetDir;
  fleetMoved = true;
}

function fleetTurnsAtEdge() {
  if (!fleetMoved || !fleetAtEdge()) return;
  fleetDir = -fleetDir;
  for (const inv of fleet())
    { inv.x += MARCH_STEP * fleetDir; inv.y += DESCENT; }
}

function fireCannon() {
  if (firePressed && canFire)
    bullets.push({ x: player.x + PLAYER_W/2, y: player.y - 6 });
}

function oneShellAtATime() {
  if (bullets.length > 0) canFire = false;
}

function invadersBomb() {
  const bomber = randomInvader();
  if (bomber && Math.random() < BOMB_CHANCE)
    bombs.push({ x: bomber.x + INV_W/2, y: bomber.y + INV_H });
}

function shotsDoDamage() {
  for (const b of bullets)
    b.hit = invaderAt(b.x, b.y) || bunkerAt(b.x, b.y);
  for (const b of bombs)
    b.hit = cannonAt(b.x, b.y) || bunkerAt(b.x, b.y);
  for (const s of shots())
    if (s.hit) { s.dead = true; damage(s.hit); }
}

function fleetDestroys() {
  for (const inv of fleet()) crushBunkers(inv);
  if (fleet().some(inv => inv.y + INV_H >= player.y)) lives = 0;
}

function boardHasEdges() {
  player.x = clamp(player.x, MARGIN, W - PLAYER_W - MARGIN);
  bullets = bullets.filter(onBoard);
  bombs   = bombs.filter(onBoard);
}

function nextWave() {
  if (invaders.every(inv => !inv.alive))
    { spawnWave(); spawnBunkers(); }
}

function checkGameOver() {
  if (lives <= 0) over = true;
}

// ---- rule registry: grouped by mechanic for the panel -------------------
const GROUPS = [
  { title: "movement", rules: [
    { fn: movePlayer,       targets: ["player"] },
    { fn: moveShots,        targets: ["bullets", "bombs"] },
    { fn: marchFleet,       targets: ["invaders"] },
    { fn: fleetTurnsAtEdge, targets: ["invaders"] },
  ]},
  { title: "firepower", rules: [
    { fn: fireCannon,       targets: ["player", "bullets"] },
    { fn: oneShellAtATime,  targets: ["player", "bullets"] },
    { fn: invadersBomb,     targets: ["invaders", "bombs"] },
  ]},
  { title: "contact", rules: [
    { fn: shotsDoDamage,    targets: ["bullets", "bombs", "invaders",
                                      "player", "bunkers",
                                      "score", "lives"] },
    { fn: fleetDestroys,    targets: ["invaders", "bunkers",
                                      "player", "lives"] },
  ]},
  { title: "the law", rules: [
    { fn: boardHasEdges,    targets: ["player", "bullets", "bombs"] },
    { fn: nextWave,         targets: ["invaders", "bunkers"] },
    { fn: checkGameOver,    targets: ["lives"] },
  ]},
];

const RULES = GROUPS.flatMap(g => g.rules);
for (const r of RULES) { r.id = r.fn.name; r.on = true; r.heat = 0; }
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));

function run(id) {
  const r = RULE[id];
  if (!r.on) return;
  const before = stateHash();
  r.fn();
  if (stateHash() !== before) r.heat = 1;
}

// ---- the meta-rule ----------------------------------------------------
// The one law of this universe that is not shown in the panel and cannot
// be switched off: nothing escapes into the void. The cannon and the
// fleet wrap around the edges of the web page, and a fleet that sinks
// below the page returns descending from the top.

// the web page's edges, in game coordinates
function pageEdges() {
  const rect = gameCanvas.getBoundingClientRect();
  const left = -(rect.left + gameCanvas.clientLeft);
  const top = -(rect.top + gameCanvas.clientTop);
  return { left, top,
           right: left + window.innerWidth,
           bottom: top + window.innerHeight };
}

function wrapAroundPage(o, w, edges) {
  if (o.x > edges.right) o.x = edges.left - w;
  else if (o.x + w < edges.left) o.x = edges.right;
}

function metaRule() {
  const edges = pageEdges();
  wrapAroundPage(player, PLAYER_W, edges);
  for (const inv of fleet()) {
    wrapAroundPage(inv, INV_W, edges);
    if (inv.y > edges.bottom) inv.y = edges.top - INV_H;
  }

  // shots that leave the page entirely, in either direction (the
  // physics can be scrubbed negative), are quietly retired
  const gone = s => s.y < edges.top - 48 || s.y > edges.bottom + 48;
  bullets = bullets.filter(b => !gone(b));
  bombs = bombs.filter(b => !gone(b));
}

// ---- main loop --------------------------------------------------------
function update() {
  if (over || paused) return;
  canFire = true;
  fleetMoved = false;
  for (const s of shots()) s.hit = null;

  run("movePlayer");
  run("oneShellAtATime");
  run("fireCannon");
  firePressed = false;
  run("moveShots");
  run("marchFleet");
  run("fleetTurnsAtEdge");
  run("invadersBomb");
  run("shotsDoDamage");
  cull();
  run("fleetDestroys");
  run("boardHasEdges");
  run("nextWave");
  run("checkGameOver");
  metaRule();

  if (hitFlash > 0) hitFlash--;
}

// ---- highlight linkage: rules <-> board --------------------------------
let hilite = null;        // Set of entity kinds to spotlight on the board
let hiliteTimeout = null;
let tick = 0;

function setHilite(kinds, ms) {
  clearTimeout(hiliteTimeout);
  hilite = new Set(kinds);
  if (ms) hiliteTimeout = setTimeout(() => { hilite = null; }, ms);
}
function clearHilite() {
  clearTimeout(hiliteTimeout);
  hilite = null;
}

// color for a kind of thing: pulses white while its rules are hovered
function ink(kind) {
  if (hilite && hilite.has(kind))
    return tick % 14 < 7 ? "#ffffff" : "#99ff99";
  return "#33ff33";
}

// ---- rendering --------------------------------------------------------
const gameCanvas = document.getElementById("game");
const ctx = gameCanvas.getContext("2d");

// A second, invisible canvas covers the whole page. Anything that leaves
// the game board is drawn here too, so switched-off boundaries don't make
// things vanish -- they escape, and crawl over the rest of the page.
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
function sizeOverlay() {
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;
}
window.addEventListener("resize", sizeOverlay);
sizeOverlay();

const INVADER_SPRITE = [
  "..X.....X..",
  "...X...X...",
  "..XXXXXXX..",
  ".XX.XXX.XX.",
  "XXXXXXXXXXX",
  "X.XXXXXXX.X",
  "X.X.....X.X",
  "...XX.XX...",
];
const PLAYER_SPRITE = [
  "......X......",
  ".....XXX.....",
  ".....XXX.....",
  ".XXXXXXXXXXX.",
  "XXXXXXXXXXXXX",
  "XXXXXXXXXXXXX",
  "XXXXXXXXXXXXX",
];

function drawSprite(g, sprite, x, y, scale) {
  for (let r = 0; r < sprite.length; r++)
    for (let c = 0; c < sprite[r].length; c++)
      if (sprite[r][c] === "X")
        g.fillRect(x + c * scale, y + r * scale, scale, scale);
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // baseline
  ctx.fillStyle = "#33ff33";
  ctx.fillRect(0, H - 24, W, 2);

  // bunkers
  ctx.fillStyle = ink("bunkers");
  for (const bunker of bunkers)
    for (let r = 0; r < bunker.cells.length; r++)
      for (let c = 0; c < bunker.cells[r].length; c++)
        if (bunker.cells[r][c])
          ctx.fillRect(bunker.x + c * BUNKER_CELL,
                       bunker.y + r * BUNKER_CELL,
                       BUNKER_CELL, BUNKER_CELL);

  // invaders
  ctx.fillStyle = ink("invaders");
  for (const inv of invaders)
    if (inv.alive) drawSprite(ctx, INVADER_SPRITE, inv.x, inv.y, 2);

  // player (blinks while recently hit)
  ctx.fillStyle = ink("player");
  if (hitFlash === 0 || Math.floor(hitFlash / 4) % 2 === 0)
    drawSprite(ctx, PLAYER_SPRITE, player.x, player.y, 2);

  // bullets & bombs (drawn from their leading tip)
  ctx.fillStyle = ink("bullets");
  for (const shot of bullets) ctx.fillRect(shot.x - 1, shot.y, 2, 8);
  ctx.fillStyle = ink("bombs");
  for (const bomb of bombs) ctx.fillRect(bomb.x - 2, bomb.y - 9, 4, 9);

  // HUD
  ctx.font = '16px "Courier New", monospace';
  ctx.textAlign = "left";
  ctx.fillStyle = ink("score");
  ctx.fillText("SCORE " + score, 12, 24);
  ctx.textAlign = "right";
  ctx.fillStyle = ink("lives");
  ctx.fillText("LIVES " + lives, W - 12, 24);

  if (over) {
    ctx.fillStyle = "#33ff33";
    ctx.textAlign = "center";
    ctx.font = '28px "Courier New", monospace';
    ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText("press R to restart", W / 2, H / 2 + 18);
  } else if (paused) {
    ctx.fillStyle = "#33ff33";
    ctx.textAlign = "center";
    ctx.font = '28px "Courier New", monospace';
    ctx.fillText("PAUSED", W / 2, H / 2 - 10);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText("press P to resume", W / 2, H / 2 + 18);
  }
}

// true if a w-by-h object at (x, y) pokes outside the game board
function escaped(x, y, w, h) {
  return x < 0 || x + w > W || y < 0 || y + h > H;
}

function drawEscaped() {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const rect = gameCanvas.getBoundingClientRect();
  const bx = rect.left + gameCanvas.clientLeft;
  const by = rect.top + gameCanvas.clientTop;

  octx.fillStyle = ink("invaders");
  for (const inv of invaders)
    if (inv.alive && escaped(inv.x, inv.y, INV_W, INV_H))
      drawSprite(octx, INVADER_SPRITE, bx + inv.x, by + inv.y, 2);

  octx.fillStyle = ink("player");
  if ((hitFlash === 0 || Math.floor(hitFlash / 4) % 2 === 0) &&
      escaped(player.x, player.y, PLAYER_W, PLAYER_H))
    drawSprite(octx, PLAYER_SPRITE, bx + player.x, by + player.y, 2);

  octx.fillStyle = ink("bullets");
  for (const shot of bullets)
    if (escaped(shot.x - 1, shot.y, 2, 8))
      octx.fillRect(bx + shot.x - 1, by + shot.y, 2, 8);

  octx.fillStyle = ink("bombs");
  for (const bomb of bombs)
    if (escaped(bomb.x - 2, bomb.y - 9, 4, 9))
      octx.fillRect(bx + bomb.x - 2, by + bomb.y - 9, 4, 9);
}

function frame() {
  tick++;
  update();
  draw();
  drawEscaped();
  for (const r of RULES) {
    r.led.style.opacity = r.heat;
    r.heat = r.heat > 0.05 ? r.heat * 0.88 : 0;
  }
  requestAnimationFrame(frame);
}

// ---- input ------------------------------------------------------------
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === " " && !e.repeat) firePressed = true;
  if (e.key === "r" || e.key === "R") reset();
  if ((e.key === "p" || e.key === "P") && !e.repeat) paused = !paused;
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

// ---- board as index: click a thing to find its laws ---------------------
function boardKindAt(x, y) {
  for (const inv of invaders)
    if (inv.alive &&
        x >= inv.x && x <= inv.x + INV_W &&
        y >= inv.y && y <= inv.y + INV_H) return "invaders";
  if (bunkerAt(x, y)) return "bunkers";
  if (x >= player.x - 4 && x <= player.x + PLAYER_W + 4 &&
      y >= player.y - 4 && y <= player.y + PLAYER_H + 4) return "player";
  for (const shot of bullets)
    if (Math.abs(x - shot.x) < 8 && Math.abs(y - (shot.y + 4)) < 12)
      return "bullets";
  for (const bomb of bombs)
    if (Math.abs(x - bomb.x) < 8 && Math.abs(y - (bomb.y - 4)) < 12)
      return "bombs";
  if (y < 34) return x < W / 2 ? "score" : "lives";
  return null;
}

function flashRule(r) {
  r.div.classList.remove("pulse");
  void r.div.offsetWidth; // restart the animation
  r.div.classList.add("pulse");
  setTimeout(() => r.div.classList.remove("pulse"), 1700);
}

// scroll only the code panel, never the page
function scrollPanelTo(r) {
  const panel = document.getElementById("codepanel");
  const top = r.div.getBoundingClientRect().top
            - panel.getBoundingClientRect().top
            + panel.scrollTop;
  panel.scrollTo({
    top: top - panel.clientHeight / 2 + r.div.clientHeight / 2,
    behavior: "smooth",
  });
}

gameCanvas.addEventListener("click", (e) => {
  if (mode !== "rules") return; // no rules to point at on tails
  const rect = gameCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left - gameCanvas.clientLeft;
  const y = e.clientY - rect.top - gameCanvas.clientTop;
  const kind = boardKindAt(x, y);
  if (!kind) return;
  const related = RULES.filter(r => r.targets.includes(kind));
  if (related.length === 0) return;
  scrollPanelTo(related[0]);
  for (const r of related) flashRule(r);
  setHilite([kind], 1700);
});

// ---- build the code panel ----------------------------------------------
// the physics values: drag one left/right to scrub it
const TUNABLES = [
  { name: "PLAYER_SPEED", step: 1,    min: 0,   max: 30,
    get: () => PLAYER_SPEED, set: v => PLAYER_SPEED = v },
  { name: "BULLET_SPEED", step: 1,    min: -20, max: 20,
    get: () => BULLET_SPEED, set: v => BULLET_SPEED = v },
  { name: "GRAVITY",      step: 1,    min: -10, max: 10,
    get: () => GRAVITY,      set: v => GRAVITY = v },
  { name: "BOMB_CHANCE",  step: 0.01, min: 0,   max: 0.5,
    get: () => BOMB_CHANCE,  set: v => BOMB_CHANCE = v },
  { name: "MARCH_STEP",   step: 1,    min: -20, max: 20,
    get: () => MARCH_STEP,   set: v => MARCH_STEP = v },
  { name: "DESCENT",      step: 1,    min: -40, max: 40,
    get: () => DESCENT,      set: v => DESCENT = v },
  { name: "POINTS",       step: 5,    min: -50, max: 100,
    get: () => POINTS,       set: v => POINTS = v },
  { name: "LIVES",        step: 1,    min: 0,   max: 9,
    get: () => LIVES,        set: v => { LIVES = v; lives = v; } },
];

function fmtVal(t) {
  return t.step < 1 ? t.get().toFixed(2) : String(t.get());
}

const constsDiv = document.getElementById("consts");
for (const t of TUNABLES) {
  t.default = t.get();
  const block = document.createElement("div");
  block.className = "tunable";

  const line = document.createElement("pre");
  line.title = "double-click to reset " + t.name;
  line.append("let " + t.name + " = ");
  const val = document.createElement("span");
  val.className = "val";
  val.textContent = fmtVal(t);
  line.append(val, ";");
  block.appendChild(line);
  t.el = val;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = t.min;
  slider.max = t.max;
  slider.step = t.step;
  slider.value = t.get();
  block.appendChild(slider);
  t.slider = slider;

  const labels = document.createElement("div");
  labels.className = "range-labels";
  const lo = document.createElement("span");
  lo.textContent = t.min;
  const hi = document.createElement("span");
  hi.textContent = t.max;
  labels.append(lo, hi);
  block.appendChild(labels);

  constsDiv.appendChild(block);

  slider.addEventListener("input", () => {
    t.set(parseFloat(slider.value));
    val.textContent = fmtVal(t);
  });

  // double-click the code line to reset just this variable
  line.addEventListener("dblclick", () => {
    t.set(t.default);
    val.textContent = fmtVal(t);
    slider.value = t.default;
  });
}

const rulesDiv = document.getElementById("rules");

// show just the statements: drop "function name() {" and "}", dedent
function ruleSource(fn) {
  return fn.toString().split("\n").slice(1, -1)
           .map(line => line.slice(2)).join("\n");
}

function syncRule(r) {
  r.div.classList.toggle("off", !r.on);
}

function toggleRule(r) {
  if (mode !== "rules") return;
  r.on = !r.on;
  syncRule(r);
}

for (const group of GROUPS) {
  const section = document.createElement("div");
  section.className = "group";

  const heading = document.createElement("h3");
  heading.textContent = group.title;
  section.appendChild(heading);

  for (const r of group.rules) {
    const div = document.createElement("div");
    div.className = "rule";
    div.title = r.fn.name + " — click to toggle this code on/off";

    const led = document.createElement("span");
    led.className = "led";
    div.appendChild(led);
    r.led = led;

    const pre = document.createElement("pre");
    pre.textContent = ruleSource(r.fn);
    div.appendChild(pre);

    div.addEventListener("click", () => toggleRule(r));
    div.addEventListener("mouseenter", () => setHilite(r.targets, 0));
    div.addEventListener("mouseleave", clearHilite);

    section.appendChild(div);
    r.div = div;
    syncRule(r);
  }
  rulesDiv.appendChild(section);
}

function restoreRules() {
  for (const r of RULES) {
    r.on = true;
    syncRule(r);
  }
}

function restorePhysics() {
  for (const t of TUNABLES) {
    t.set(t.default);
    t.el.textContent = fmtVal(t);
    t.slider.value = t.default;
  }
}

const restoreBtn = document.getElementById("restoreBtn");
restoreBtn.addEventListener("click", () => {
  restoreRules();
  restorePhysics();
});
document.getElementById("restartBtn").addEventListener("click", reset);

// ---- the meta-toggle: heads = rules, tails = variables ------------------
// One side of the coin at a time. On tails, every rule locks back on
// and only the physics is shown, live; on heads, the physics snaps
// back to default and only the rules are shown, clickable.
let mode;
const modeBtns = document.querySelectorAll("#modeToggle button");
const modeHint = document.getElementById("modeHint");
const HINTS = {
  rules: "Click a rule to toggle it on or off. Dots glow as rules fire. ",
  vars:  "Slide a value to change it. Doubleclick to reset.",
};

function setMode(m) {
  mode = m;
  if (m === "vars") restoreRules();
  else restorePhysics();
  document.getElementById("physicsGroup").style.display =
    m === "vars" ? "" : "none";
  rulesDiv.style.display = m === "vars" ? "none" : "";
  for (const btn of modeBtns)
    btn.classList.toggle("active", btn.dataset.mode === m);
  modeHint.textContent = HINTS[m];
  restoreBtn.textContent =
    m === "vars" ? "reset the physics" : "restore all code";
}

for (const btn of modeBtns)
  btn.addEventListener("click", () => setMode(btn.dataset.mode));
setMode("rules");

// ---- go ----------------------------------------------------------------
reset();
frame();
</script>
</body>
</html>
