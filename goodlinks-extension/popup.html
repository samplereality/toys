<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div id="status-banner" class="hidden"></div>

    <div id="setup-prompt" class="hidden">
      <p>Please configure your GoodLinks API settings to get started.</p>
      <button id="open-options">Open Settings</button>
    </div>

    <div id="save-form">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Page title">
      </div>

      <div class="field">
        <label for="url">URL</label>
        <input type="text" id="url" placeholder="Page URL" readonly>
      </div>

      <div class="field">
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="tag1, tag2, tag3">
      </div>

      <div class="field checkbox-field">
        <label>
          <input type="checkbox" id="starred">
          Starred
        </label>
      </div>

      <div class="actions">
        <button id="save-btn" class="primary">Save to GoodLinks</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
